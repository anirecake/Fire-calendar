<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FireCalendar · Central Asia</title>
  <meta name="description" content="Harmonized MODIS + VIIRS fire hotspots for Central Asia, 2000 to today: what kind of fires, why, and what next." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff4d1a' d='M12 2c1 3.5-1.5 5-1.5 7.5 0 1.4 1 2.5 2.3 2.5 1.6 0 2.4-1.4 2.2-3.2C17.6 10.6 19 13 19 15.5 19 19.6 15.9 22 12 22s-7-2.4-7-6.5C5 10 10.5 7.5 12 2z'/%3E%3C/svg%3E" />
  <script>
    /* theme before first paint: saved choice, else dark (black) */
    (function () {
      var t = null;
      try { t = localStorage.getItem("fc-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- three typefaces, three jobs: Unbounded = headlines, Golos Text = reading, IBM Plex Mono = numbers & labels -->
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=43" />
</head>
<body>
  <div id="map" aria-label="Map"></div>
  <div class="map-tip" id="map-tip" hidden></div>

  <!-- ============ top bar ============ -->
  <header class="topbar panel-box">
    <a class="brand" href="#" aria-label="FireCalendar">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-1.5 7.5 0 1.4 1 2.5 2.3 2.5 1.6 0 2.4-1.4 2.2-3.2C17.6 10.6 19 13 19 15.5 19 19.6 15.9 22 12 22s-7-2.4-7-6.5C5 10 10.5 7.5 12 2z"/></svg>
      <span class="brand-name">FIRE<span>CALENDAR</span></span>
      <span class="brand-region" data-i18n="region"></span>
    </a>
    <nav class="dom-switch" id="dom-switch" aria-label="Region">
      <a data-dom="ca"><span class="dl" data-i18n="dom_ca"></span><span class="ds" data-i18n="dom_ca_s"></span></a><a data-dom="us"><span data-i18n="dom_us"></span></a>
    </nav>
    <span class="badge" id="data-date"></span>
    <span class="spacer"></span>
    <button type="button" class="bell-btn" id="alerts-btn" data-i18n-title="al_title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span data-i18n="al_btn"></span>
    </button>
    <button type="button" class="icon-btn" id="help-btn" data-i18n-title="help" aria-label="?">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.5M12 17h.01"/></svg>
    </button>
    <button type="button" class="icon-btn" id="theme-btn" data-i18n-title="theme" aria-label="theme">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="kk">ҚАЗ</button>
      <button type="button" data-lang="ru">РУС</button>
      <button type="button" data-lang="en">ENG</button>
    </div>
  </header>

  <!-- ============ view + area picker ============ -->
  <section class="picker panel-box" aria-label="Area">
    <button type="button" class="picker-toggle" id="picker-toggle" aria-expanded="true" aria-controls="picker-body">
      <span class="pt-text"><span class="pt-title" data-i18n="picker_title"></span><span class="pt-sum" id="picker-sum"></span></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="picker-body" id="picker-body">
      <p class="label step" data-i18n="step_who"></p>
      <div class="views" role="tablist" id="views">
        <button type="button" role="tab" data-view="overview"><span class="v-name" data-i18n="view_overview"></span><small data-i18n="view_overview_d"></small></button>
        <button type="button" role="tab" data-view="emergency"><span class="v-name" data-i18n="view_emergency"></span><small data-i18n="view_emergency_d"></small></button>
        <button type="button" role="tab" data-view="analyst"><span class="v-name" data-i18n="view_analyst"></span><small data-i18n="view_analyst_d"></small></button>
      </div>

      <div class="field">
        <label class="label step" for="country" data-i18n="step_country"></label>
        <select id="country"></select>
      </div>
      <div class="field">
        <label class="label step" for="region" data-i18n="step_region"></label>
        <select id="region"></select>
      </div>
      <p class="next-hint"><span class="nh-desk" data-i18n="step_next"></span><span class="nh-phone" data-i18n="step_next_phone"></span></p>

      <details class="more" id="more">
        <summary data-i18n="more_ways"></summary>
        <div class="more-body">
          <div class="btn-row">
            <button type="button" class="btn" id="draw-rect"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12"/></svg><span data-i18n="draw_rect"></span></button>
            <button type="button" class="btn" id="draw-poly"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7-5 7 5-3 10H8z"/></svg><span data-i18n="draw_poly"></span></button>
            <button type="button" class="btn" id="point-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/></svg><span data-i18n="mode_point"></span></button>
          </div>
          <p class="hint" id="more-hint" data-i18n="draw_hint"></p>
          <div id="point-pane" hidden>
            <form class="coords" id="coords" novalidate>
              <label><span class="label" data-i18n="coord_lat"></span><input type="text" id="lat-in" inputmode="decimal" autocomplete="off" placeholder="43.24" /></label>
              <label><span class="label" data-i18n="coord_lon"></span><input type="text" id="lon-in" inputmode="decimal" autocomplete="off" placeholder="76.95" /></label>
              <button type="submit" class="btn" data-i18n="coord_go"></button>
            </form>
            <p class="note warn" id="coord-msg" hidden></p>
            <div class="chips" id="places"></div>
            <div class="radius">
              <label for="radius" data-i18n="radius"></label>
              <input type="range" id="radius" min="10" max="200" step="5" value="50" />
              <output id="radius-out" for="radius">50 km</output>
            </div>
          </div>
        </div>
      </details>
    </div>
  </section>

  <!-- ============ map time controls + legend ============ -->
  <div class="timebar panel-box">
    <label class="map-year">
      <span class="label" data-i18n="map_label"></span>
      <select id="map-year"></select>
    </label>
    <button type="button" class="btn btn-primary" id="play" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-play"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      <span id="play-label" data-i18n="play"></span>
    </button>
    <button type="button" class="btn" id="clear-month" hidden data-i18n="clear_month"></button>
  </div>
  <div class="legend panel-box">
    <div class="seg em-modes" id="em-modes" role="tablist">
      <button type="button" role="tab" data-em="risk" data-i18n="em_risk"></button>
      <button type="button" role="tab" data-em="fires" data-i18n="em_fires"></button>
    </div>
    <div class="seg risk-views" id="risk-views" role="tablist" hidden>
      <button type="button" role="tab" data-rv="cells" data-i18n="rv_cells"></button>
      <button type="button" role="tab" data-rv="smooth" data-i18n="rv_smooth"></button>
    </div>
    <div id="metric-wrap" hidden>
      <label class="metric"><span class="label" data-i18n="metric_label"></span>
        <select id="metric">
          <option value="avg" data-i18n="metric_avg"></option>
          <option value="trend" data-i18n="metric_trend"></option>
          <option value="last" data-i18n="metric_last"></option>
          <option value="large" data-i18n="metric_large"></option>
          <option value="risk" data-i18n="metric_risk"></option>
        </select>
      </label>
    </div>
    <span class="label" id="legend-label"></span>
    <div class="ramp" id="ramp" aria-hidden="true"></div>
    <div class="ramp-labels" id="ramp-labels"></div>
    <div class="swatches" id="swatches" hidden></div>
  </div>

  <!-- ============ report sheet ============ -->
  <aside class="sheet panel-box" id="sheet" aria-label="Report">
    <button type="button" class="sheet-handle" id="sheet-toggle" aria-expanded="false">
      <span class="grip" aria-hidden="true"></span>
      <span class="sr-only" data-i18n="panel_show"></span>
    </button>
    <div class="sheet-head">
      <div class="head-row">
        <h1 id="area-name"></h1>
        <button type="button" class="icon-btn sheet-close" id="sheet-hide" data-i18n-title="panel_hide" aria-label="hide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <p class="view-hint" id="view-hint"></p>
      <div class="period" id="period">
        <span class="label" data-i18n="period"></span>
        <select id="from" aria-label="from"></select>
        <span aria-hidden="true">—</span>
        <select id="to" aria-label="to"></select>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>

    <div class="sheet-scroll" id="sheet-scroll" aria-live="polite">
      <div class="status" id="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text"></span>
        <button type="button" class="btn" id="retry" hidden data-i18n="retry"></button>
      </div>
      <p class="empty" id="empty" hidden data-i18n="empty"></p>

      <div id="panels">
        <!-- ===== answer: overview + emergency "now" ===== -->
        <article class="answer" data-panel="overview:now emergency:now">
          <div class="ans-top"><p class="eyebrow" id="ans-eyebrow"></p><button type="button" class="back-now" id="back-now" hidden></button></div>
          <p class="answer-main" id="ans-main"></p>
          <div class="band" id="band">
            <div class="band-track"><div class="band-normal" id="band-normal"></div><div class="band-mark" id="band-mark"></div></div>
            <div class="band-labels"><span id="band-lo"></span><span id="band-caption"></span><span id="band-hi"></span></div>
          </div>
          <dl class="facts">
            <div><dt data-i18n="fact_ytd"></dt><dd id="f-ytd"></dd></div>
            <div><dt id="f-last-l"></dt><dd id="f-last"></dd></div>
            <div><dt data-i18n="fact_season"></dt><dd id="f-season"></dd></div>
          </dl>
        </article>

        <!-- ===== emergency: risk headline + active fires ===== -->
        <section class="block" data-panel="emergency:now">
          <h2 data-i18n="risk_title"></h2>
          <p class="desc" id="risk-desc"></p>
          <div id="risk-head"></div>
        </section>
        <section class="block" data-panel="emergency:now">
          <h2 data-i18n="active_title"></h2>
          <p class="desc" id="active-desc"></p>
          <div class="rows" id="active-list"></div>
        </section>
        <section class="block" data-panel="emergency:why"><div id="risk-why"></div></section>
        <section class="block" data-panel="emergency:act"><div id="risk-act"></div></section>
        <section class="block" data-panel="emergency:regions">
          <h2 data-i18n="risk_list_title"></h2>
          <ol class="rows rank" id="risk-list"></ol>
          <p class="note" id="risk-reliability"></p>
        </section>

        <!-- ===== overview ===== -->
        <section class="block" data-panel="overview:now">
          <h2 data-i18n="ytd_title"></h2>
          <p class="desc" data-i18n="ytd_desc"></p>
          <div id="ytd-chart" class="chart"></div>
          <p class="note" id="ytd-ref"></p>
        </section>
        <section class="block" data-panel="overview:season">
          <h2 data-i18n="season_title"></h2>
          <p class="lead" id="season-text"></p>
          <div class="season" id="season" role="list"></div>
          <div class="risk-legend">
            <span><i class="r-high"></i><span data-i18n="risk_high"></span></span>
            <span><i class="r-elevated"></i><span data-i18n="risk_elevated"></span></span>
            <span><i class="r-low"></i><span data-i18n="risk_low"></span></span>
          </div>
          <p class="desc" data-i18n="season_desc"></p>
        </section>
        <section class="block" data-panel="overview:season">
          <div class="block-head">
            <h2 data-i18n="cal_title"></h2>
            <div class="seg" role="tablist" id="cal-modes">
              <button type="button" role="tab" data-cal="count" data-i18n="cal_count"></button>
              <button type="button" role="tab" data-cal="anom" data-i18n="cal_anom"></button>
            </div>
          </div>
          <p class="desc" id="cal-desc"></p>
          <div id="cal-chart" class="chart chart-cal"></div>
        </section>
        <section class="block" data-panel="overview:trend">
          <h2 data-i18n="trend_title"></h2>
          <p class="lead" id="trend-text"></p>
          <label class="toggle"><input type="checkbox" id="show-raw" /><span data-i18n="show_raw"></span></label>
          <div id="trend-chart" class="chart chart-tall"></div>
          <p class="desc" data-i18n="trend_desc"></p>
          <p class="callout" id="trend-viirs" hidden></p>
        </section>

        <!-- ===== analyst ===== -->
        <section class="block" data-panel="analyst:regions">
          <h2 data-i18n="an_regions_title"></h2>
          <p class="desc" data-i18n="an_regions_desc"></p>
          <div class="table-wrap"><table class="data" id="reg-table"></table></div>
          <div id="reg-more"></div>
        </section>
        <section class="block" data-panel="analyst:fires">
          <h2 data-i18n="ev_title"></h2>
          <p class="desc" data-i18n="ev_desc"></p>
          <div class="chips" id="ev-types"></div>
          <div class="ev-filters">
            <label><span class="label" data-i18n="ev_min_area"></span>
              <select id="ev-min"><option value="0">0</option><option value="1">1</option><option value="5">5</option><option value="10">10</option><option value="50">50</option><option value="100">100</option></select>
            </label>
            <label><span class="label" data-i18n="ev_sort"></span>
              <select id="ev-sort">
                <option value="area_km2" data-i18n="sort_area"></option>
                <option value="frp_max_mw" data-i18n="sort_frp"></option>
                <option value="duration_days" data-i18n="sort_duration"></option>
                <option value="spread_km_day" data-i18n="sort_spread"></option>
                <option value="start" data-i18n="sort_start"></option>
              </select>
            </label>
          </div>
          <p class="lead" id="ev-count"></p>
          <div class="rows" id="ev-list"></div>
          <div id="ev-more"></div>
        </section>
        <section class="block" data-panel="analyst:props">
          <h2 data-i18n="ev_year_title"></h2>
          <div id="ev-year-chart" class="chart"></div>
        </section>
        <section class="block" data-panel="analyst:props">
          <h2 data-i18n="ev_scatter_title"></h2>
          <p class="desc" data-i18n="ev_scatter_desc"></p>
          <div id="ev-scatter" class="chart chart-tall"></div>
        </section>

        <!-- ===== after the fire: reports (all views) ===== -->
        <section class="block" id="fires-block" data-panel="overview:after emergency:after analyst:after">
          <h2 data-i18n="fr_title"></h2>
          <p class="desc" data-i18n="fr_desc"></p>
          <p class="lead" id="fires-count"></p>
          <div class="rows" id="fires-list"></div>
        </section>

        <!-- ===== data + method (overview + analyst) ===== -->
        <section class="block" data-panel="overview:data analyst:data">
          <h2 data-i18n="dl_title"></h2>
          <p class="desc" data-i18n="dl_desc"></p>
          <div class="btn-col">
            <button type="button" class="btn" id="dl-monthly" data-i18n="dl_monthly"></button>
            <button type="button" class="btn" id="dl-json" data-i18n="dl_json"></button>
            <button type="button" class="btn" id="dl-events" data-i18n="dl_events"></button>
          </div>
          <div class="dl-points">
            <label><span class="label" data-i18n="dl_from"></span><input type="date" id="dl-start" /></label>
            <label><span class="label" data-i18n="dl_to"></span><input type="date" id="dl-end" /></label>
            <button type="button" class="btn" id="dl-points" data-i18n="dl_points"></button>
          </div>
          <p class="note warn" id="dl-msg" hidden></p>
        </section>
        <section class="block method" data-panel="overview:data analyst:data">
          <h2 data-i18n="m_title"></h2>
          <div class="method-body">
            <div><h3 data-i18n="m_1t"></h3><p data-i18n="m_1"></p></div>
            <div><h3 data-i18n="m_2t"></h3><p data-i18n="m_2"></p></div>
            <div><h3 data-i18n="m_3t"></h3><p data-i18n="m_3"></p><div id="val-table"></div><p class="note" id="val-cov"></p></div>
            <div><h3 data-i18n="ratio_title"></h3><div id="ratio-chart" class="chart chart-small"></div><p class="note" data-i18n="ratio_desc"></p></div>
            <div><h3 data-i18n="m_4t"></h3><p data-i18n="m_4"></p></div>
            <div><h3 data-i18n="m_5t"></h3><p data-i18n="m_5"></p></div>
            <div><h3 data-i18n="m_6t"></h3><p data-i18n="m_6"></p><div id="risk-val"></div></div>
            <div><h3 data-i18n="si_title"></h3><p data-i18n="si_note"></p></div>
          </div>
        </section>
      </div>

      <footer class="foot">
        <span data-i18n="footer"></span>
        <a href="/docs" target="_blank" rel="noopener" data-i18n="api_docs"></a>
      </footer>
    </div>
  </aside>
  <button type="button" class="btn sheet-open" id="sheet-show" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <span data-i18n="panel_show"></span>
  </button>

  <!-- ============ fire alerts dialog (bell button in the top bar) ============ -->
  <div class="onb fire-dlg" id="fire-dlg" hidden>
    <div class="onb-card panel-box fire-card" role="dialog" aria-modal="true" aria-labelledby="fr-title" id="fire-body"></div>
  </div>
  <div class="onb alerts-dlg" id="alerts-dlg" hidden>
    <div class="onb-card panel-box alerts-block" role="dialog" aria-modal="true" aria-labelledby="al-title">
      <div class="head-row"><h2 id="al-title" data-i18n="al_title"></h2>
        <button type="button" class="icon-btn" id="alerts-close" data-i18n-title="ai_close" aria-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p class="desc" data-i18n="al_desc"></p>
      <div class="push-setup" id="push-setup">
        <div class="push-row">
          <label><span class="label" data-i18n="al_where"></span>
            <select id="push-where"><option value="me" data-i18n="al_where_me"></option><option value="area" data-i18n="al_where_area"></option></select></label>
          <label><span class="label" data-i18n="al_radius"></span>
            <select id="push-radius"><option>10</option><option selected>30</option><option>50</option><option>100</option></select></label>
        </div>
        <button type="button" class="btn btn-primary" id="push-on">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span data-i18n="al_on"></span>
        </button>
      </div>
      <div class="push-active" id="push-active" hidden>
        <p class="lead" id="push-status"></p>
        <div class="push-row">
          <button type="button" class="btn" id="push-test" data-i18n="al_test"></button>
          <button type="button" class="btn" id="push-off" data-i18n="al_off"></button>
        </div>
      </div>
      <p class="note warn" id="push-msg" hidden></p>
      <p class="note" data-i18n="al_privacy"></p>
      <p class="tg-alt" id="tg-alt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/></svg>
        <span data-i18n="al_or_tg"></span> <a id="tg-link" href="#" target="_blank" rel="noopener"></a>
      </p>
    </div>
  </div>

  <!-- ============ first-visit guide ============ -->
  <div class="onb" id="onb" hidden>
    <div class="onb-card panel-box" role="dialog" aria-modal="true" aria-labelledby="onb-title">
      <h2 id="onb-title" data-i18n="onb_title"></h2>
      <ol class="onb-steps">
        <li><span class="num">01</span><p data-i18n="onb_1"></p></li>
        <li><span class="num">02</span><p data-i18n="onb_2"></p></li>
        <li><span class="num">03</span><p data-i18n="onb_3"></p></li>
      </ol>
      <p class="note" data-i18n="onb_note"></p>
